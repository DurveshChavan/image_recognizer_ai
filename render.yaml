services:
  - type: web
    name: ai-image-recognition-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd YOLOv10 && python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true

